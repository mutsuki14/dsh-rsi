name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Explicit per-leg values: an `a && '' || 'b'` expression yields 'b' even when `a` holds.
        include:
          - dsh: '0.2.1-alpha.2'
            legacy: ''
            typecheck: typecheck
          - dsh: '0.2.0-rc.2'
            legacy: '1'
            typecheck: 'typecheck:legacy'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install (committed lockfile, alpha line)
        if: matrix.dsh == '0.2.1-alpha.2'
        run: pnpm install --frozen-lockfile
      - name: Install (rc line)
        if: matrix.dsh != '0.2.1-alpha.2'
        run: |
          node scripts/use-dsh.mjs ${{ matrix.dsh }}
          # Resolve from scratch: the committed lockfile would keep alpha transitive packages in the rc graph.
          rm pnpm-lock.yaml
          pnpm install --no-frozen-lockfile
      - name: Typecheck
        run: pnpm run ${{ matrix.typecheck }}
      - name: Unit and real-runtime tests
        run: pnpm run test
        env:
          DSH_LEGACY: ${{ matrix.legacy }}
      - name: Offline dsh headless end-to-end
        run: pnpm run e2e
        env:
          DSH_VERSION: ${{ matrix.dsh }}
